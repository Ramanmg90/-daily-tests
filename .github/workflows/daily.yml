name: daily-tests

on:
  schedule:
    - cron: "0 12 * * *"   # ساعت UTC. 12:00 UTC = 16:00 به وقت باکو
  workflow_dispatch:        # برای تست دستی

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts and PDF libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          SUBJECT: ${{ vars.SUBJECT }}
          GRADE: ${{ vars.GRADE }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          TOPICS: ${{ vars.TOPICS }}
        run: python main.py
      - name: Save history
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git commit -m "update history" || echo "no changes"
          git push
